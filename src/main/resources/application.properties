spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

storage.type=${STORAGE_TYPE:minio}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.external-endpoint=${MINIO_EXTERNAL_ENDPOINT:${MINIO_ENDPOINT}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket-name=${MINIO_BUCKET_NAME:obscura-photos}
storage.local.upload-dir=${PHOTO_UPLOAD_DIR:/uploads}

server.base-url=${BACKEND_URL}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false

logging.level.root=WARN
logging.level.com.example.obscura_backend=INFO
logging.level.com.example.obscura_backend.filter=WARN
logging.level.com.example.obscura_backend.config=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=ERROR
logging.level.org.apache.catalina=ERROR
logging.level.org.apache.tomcat=ERROR
logging.level.io.minio=ERROR
